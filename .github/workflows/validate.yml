name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test*.txt
      - run: pip install uv==0.12.10
      - run: uv pip install --system -r requirements-test.txt --override requirements-test-overrides.txt
      - run: python -m pytest --timeout=30
      - run: ruff check .
      - run: ruff format --check .
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python3 -m pip download --no-deps home-assistant-frontend==20260826.6 -d /tmp/glucifer-frontend
      - run: python3 -m zipfile -e /tmp/glucifer-frontend/home_assistant_frontend-20260826.6-py3-none-any.whl /tmp/glucifer-frontend/unpacked
      - run: node tests/frontend/native-check.cjs
        env:
          GLUCIFER_HA_FRONTEND: /tmp/glucifer-frontend/unpacked/hass_frontend
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
